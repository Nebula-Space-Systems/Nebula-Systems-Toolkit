[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nebula"
version = "0.1.0"
description = "Nebula Python library for space systems engineering and analysis."
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [{ name = "Nathan Spencer", email = "nathanss1997@gmail.com" }]
dependencies = [
    "numpy>=1.22",
    "numba>=0.59.0",
]

[project.optional-dependencies]
propagation = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
]
plotting = [
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
]
test = [
    "pytest>=8.0",
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
]
all = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nebula"]
