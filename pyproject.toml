[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nstk"
version = "0.1.0"
description = "Nebula Space Toolkit (nstk) for space systems engineering and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [{ name = "Nathan Spencer", email = "nathanss1997@gmail.com" }]
keywords = [
    "space",
    "astrodynamics",
    "orekit",
    "orbit",
    "coverage",
    "satellite",
    "systems-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.59.0",
    "matplotlib>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyshp>=2.3",
    "nstk-data>=0.1.0",
]

[project.optional-dependencies]
propagation = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
]
plotting = [
    "cartopy>=0.21",
]
test = [
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "cartopy>=0.21",
]
all = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "cartopy>=0.21",
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["nstk"]

[tool.hatch.build.targets.wheel.force-include]
"nstk/propagation/_java_orbit_propagation/OrekitOrbitPropagationBridge.jar" = "nstk/propagation/_java_orbit_propagation/OrekitOrbitPropagationBridge.jar"
"nstk/propagation/_java_attitude_providers/NSTKAttitudeProviders.jar" = "nstk/propagation/_java_attitude_providers/NSTKAttitudeProviders.jar"
"nstk/transforms/java_timed_rotations/TimedRotationBridge.jar" = "nstk/transforms/java_timed_rotations/TimedRotationBridge.jar"

[tool.hatch.build.targets.sdist]
include = [
    "nstk/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
