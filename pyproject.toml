[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nstk"
version = "0.1.0"
description = "Nebula Space Toolkit (nstk) for space systems engineering and analysis."
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [{ name = "Nathan Spencer", email = "nathanss1997@gmail.com" }]
dependencies = [
    "numpy>=1.22",
    "numba>=0.59.0",
    "rasterio>=1.3",
    "nstk-data>=0.1.0",
]

[project.optional-dependencies]
propagation = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
]
plotting = [
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
]
test = [
    "pytest>=8.0",
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
]
all = [
    "astropy>=5.0",
    "orekit-jpype[jdk4py]>=11.0.2",
    "matplotlib>=3.6",
    "cartopy>=0.21",
    "shapely>=2.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nstk"]

[tool.hatch.build.targets.wheel.force-include]
"nstk/propagation/_java_orbit_propagation/OrekitOrbitPropagationBridge.jar" = "nstk/propagation/_java_orbit_propagation/OrekitOrbitPropagationBridge.jar"

[tool.hatch.build.targets.sdist]
include = [
    "nstk/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
