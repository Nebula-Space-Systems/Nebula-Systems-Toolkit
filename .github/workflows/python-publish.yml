name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          jar --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Verify NSTK Java attitude bridge is JVM-compatible
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          import nstk.propagation._attitude_provider_java as bridge

          prebuilt = Path(bridge._prebuilt_jar())
          with zipfile.ZipFile(prebuilt, mode="r") as zf:
              major = int.from_bytes(
                  zf.read("com/nstk/attitudes/RateLimitedYawSteeringProvider.class")[6:8],
                  byteorder="big",
                  signed=False,
              )
          print(f"prebuilt attitude class major={major}")
          print(f"JAVA_HOME={os.environ.get('JAVA_HOME','')}")

          cp = bridge.prepare_attitude_providers_classpath()
          print(f"resolved classpath={cp}")
          if not cp:
              raise SystemExit(
                  "NSTK attitude bridge classpath could not be resolved to a compatible artifact."
              )
          PY

      - name: Run test suite
        run: pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          jar --version

      - name: Validate release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          version = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"]
          release_tag = "${{ github.event.release.tag_name }}"
          valid_tags = {version, f"v{version}"}

          if release_tag not in valid_tags:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {version!r}. "
                  f"Expected one of: {sorted(valid_tags)!r}"
              )

          print(f"Release tag {release_tag} matches package version {version}.")
          PY

      - name: Upgrade pip and build tools
        run: python -m pip install --upgrade pip build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nstk
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
